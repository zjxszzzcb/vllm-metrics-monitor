services:
  vmm:
    build: .
    container_name: vmm
    network_mode: host
    # ENTRYPOINT is "vmm"; override it so the env var can word-split into
    # multiple positional URL arguments. Set METRICS_URLS in a local .env
    # file (gitignored) or the environment.
    entrypoint: sh -c 'vmm ${METRICS_URLS:-http://localhost:8000/metrics} -p 8080'
    volumes:
      - vmm-data:/root/.vmm
    restart: unless-stopped

volumes:
  vmm-data:
