services:
  vmm:
    build: .
    container_name: vmm
    network_mode: host
    # ENTRYPOINT is "vmm"; override it so the env var can word-split into
    # multiple positional URL arguments. Set METRICS_URLS in a local .env
    # file (gitignored) or the environment.
    entrypoint: sh -c 'vmm ${METRICS_URLS:-http://localhost:8000/metrics} -p 8080'
    volumes:
      - vmm-data:/root/.vmm
    restart: unless-stopped
    healthcheck:
      # Surfaces an unresponsive dashboard as "unhealthy" in docker ps.
      # (Plain Docker does not auto-restart unhealthy containers; pair with
      # an autoheal service if you want that.)
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/sources', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  vmm-data:
