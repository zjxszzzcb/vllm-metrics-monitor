services:
  vmm:
    build: .
    container_name: vmm
    network_mode: host
    # ENTRYPOINT is "vmm"; override it so the env var can word-split into
    # multiple positional URL arguments.
    entrypoint: sh -c 'vmm ${METRICS_URLS:-http://127.0.0.1:18803/metrics http://127.0.0.1:18800/metrics http://127.0.0.1:18801/metrics} -p 8080'
    volumes:
      - vmm-data:/root/.vmm
    restart: unless-stopped

volumes:
  vmm-data:
