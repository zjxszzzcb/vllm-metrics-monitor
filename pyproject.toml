[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-metrics-monitor"
version = "0.3.3"
description = "Lightweight monitoring dashboard for vLLM inference servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["vllm", "monitoring", "dashboard", "metrics", "prometheus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.scripts]
vmm = "vllm_metrics_monitor.cli:main"

[project.urls]
Repository = "https://github.com/zjxszzzcb/vllm-metrics-monitor"
Issues = "https://github.com/zjxszzzcb/vllm-metrics-monitor/issues"
